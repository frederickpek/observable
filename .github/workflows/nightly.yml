name: nightly snapshot + deploy

on:
  schedule:
    # 06:00 SGT Tue–Sat (22:00 UTC Mon–Fri): main sync after the US close (04:00/05:00 SGT).
    - cron: '0 22 * * 1-5'
    # 08:00, 10:00, 12:00 SGT Tue–Sat: gap-fill checks. Only tickers missing for the latest
    # session are fetched; if nothing is missing the run exits without deploying.
    - cron: '0 0,2,4 * * 2-6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do'
        type: choice
        options: [fill-missing, refetch-all, deploy-only]
        default: fill-missing
  push:
    branches: [master]
    paths: ['web/**', '.github/workflows/nightly.yml']

permissions:
  contents: write   # push the data branch
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      updated: ${{ steps.run.outputs.updated }}
      missing: ${{ steps.run.outputs.missing }}
    steps:
      - uses: actions/checkout@v4

      # Stored history lives on an orphan `data` branch; first run starts empty.
      - name: Check out data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add --detach data-store FETCH_HEAD
          else
            mkdir data-store
          fi

      - uses: actions/setup-python@v5
        if: github.event_name != 'push' && inputs.mode != 'deploy-only'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Snapshot chains
        id: run
        if: github.event_name != 'push' && inputs.mode != 'deploy-only'
        run: |
          pip install -q -r pipeline/requirements.txt
          python -m pipeline.run --out data-store --status-file status.json \
            ${{ inputs.mode == 'refetch-all' && ' ' || '--only-missing' }}
          echo "updated=$(jq -r '.updated | join(" ")' status.json)" >> "$GITHUB_OUTPUT"
          echo "missing=$(jq -r '.missing | join(" ")' status.json)" >> "$GITHUB_OUTPUT"
          {
            echo "### Snapshot for session $(jq -r .session status.json)"
            echo "- updated: $(jq -r '.updated | join(", ")' status.json)"
            echo "- still missing: $(jq -r '.missing | join(", ")' status.json)"
            jq -r '.failures | to_entries[] | "- ❌ \(.key): \(.value)"' status.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish data branch (single commit, replaces history)
        if: steps.run.outputs.updated != ''
        working-directory: data-store
        run: |
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "snapshot $(jq -r .generatedAt index.json)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data

      - uses: actions/setup-node@v4
        if: steps.run.outputs.updated != '' || github.event_name == 'push' || inputs.mode == 'deploy-only'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        if: steps.run.outputs.updated != '' || github.event_name == 'push' || inputs.mode == 'deploy-only'
        working-directory: web
        run: |
          npm ci
          npm run build
          if [ -f ../data-store/index.json ]; then
            mkdir -p dist/data && cp -r ../data-store/index.json ../data-store/metrics.json ../data-store/chains dist/data/
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.updated != '' || github.event_name == 'push' || inputs.mode == 'deploy-only'
        with:
          path: web/dist

      # The 12:00 SGT check is the last chance for the day: go red if anything is still missing.
      - name: Fail if tickers are still missing after the final check
        if: github.event.schedule == '0 0,2,4 * * 2-6' && steps.run.outputs.missing != ''
        run: |
          if [ "$(date -u +%H)" -ge 4 ]; then
            echo "::error::Still missing after final check: ${{ steps.run.outputs.missing }}"
            exit 1
          fi

  deploy:
    needs: snapshot
    if: always() && needs.snapshot.result != 'cancelled' && (needs.snapshot.outputs.updated != '' || github.event_name == 'push' || inputs.mode == 'deploy-only')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
